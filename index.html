  "mcgorman":{ surname:"McGorman", irish:"Mag Gormáin", meaning:"Son of Gormán — blue or noble", county:"Laois, Monaghan, Clare", province:"Leinster & Ulster", type:"Gaelic Irish", history:"The Mac Gormans were a notable Leinster family in County Laois, also found in Monaghan. The name Gormán means blue or noble — the colour blue was deeply significant in Irish culture, associated with the aristocracy.", diaspora:"McGorman is rare in the diaspora but found in Irish communities in the United States and Britain.", hook:"McGorman means son of the noble blue — because in ancient Ireland the colour blue was the mark of the aristocracy. Your ancestors were named for their rank." },
  "dunn":{ surname:"Dunn", irish:"Ó Duinn", meaning:"Descendant of Donn — brown-haired or dark", county:"Laois, Offaly, Kildare", province:"Leinster", type:"Gaelic Irish", history:"The O'Dunns were the ruling clan of Iregan in County Laois. Donn was also the name of the Irish god of the dead — lord of the otherworld — giving this name a mythological depth beyond its physical meaning.", diaspora:"Dunn is common in the Irish diaspora in the United States and Britain, concentrated from Leinster emigration.", hook:"Dunn means dark one — and in Irish mythology Donn was the lord of the dead, ruler of the otherworld. Your name carries the echo of a god." },
  "ford":{ surname:"Ford", irish:"Mac Giolla na Naomh", meaning:"Son of the servant of the saints — anglicised as Ford in Connacht", county:"Galway, Mayo", province:"Connacht", type:"Gaelic Irish", history:"In Connacht, Ford is often an anglicisation of Mac Giolla na Naomh. Henry Ford, founder of the Ford Motor Company, had Irish ancestry — his maternal great-grandmother came from Cork.", diaspora:"Ford is common in the Irish diaspora, with Henry Ford's Irish roots among the most celebrated.", hook:"Henry Ford — the man who put the world on wheels — had Irish blood. His family came from Cork. And the Ford Motor Company was built in part on the legacy of Irish emigration." },
  "smith":{ surname:"Smith", irish:"Mac Gabhann / Ó Gabhann", meaning:"Son of the smith — from gabhann, meaning blacksmith", county:"Cavan, Monaghan, Armagh", province:"Ulster", type:"Gaelic Irish / English", history:"The Ulster Smiths are often of Gaelic Irish origin — Mac Gabhann, son of the blacksmith — rather than English settler origin. The Mac Gowans of Cavan and Monaghan became Smith when their name was translated rather than phonetically anglicised.", diaspora:"Smith is the most common surname in the United States, the United Kingdom, and Australia.", hook:"Smith is the most common surname in the English-speaking world. But the Ulster Smiths aren't English — they are Mac Gabhann, the sons of the blacksmith, a Gaelic Irish clan whose name was translated rather than just anglicised." },
  "king":{ surname:"King", irish:"Ó Cionga / Mac Conraoi", meaning:"Anglicisation of various Irish names, or English settler name", county:"Roscommon, Galway, Cork", province:"Connacht & Munster", type:"Gaelic Irish / English Settler", history:"King in Ireland has multiple origins. In Connacht it was used as an anglicisation of Ó Cionga, a Roscommon family. In other regions it translated Gaelic names that contained the element rí meaning king.", diaspora:"King is common in the Irish diaspora in the United States and Britain.", hook:"King might be the most direct name in Ireland — but behind it are multiple completely different Irish origins depending on your county. The same English word hiding three different Gaelic stories." },
  "mitchell":{ surname:"Mitchell", irish:"Mistéil", meaning:"From the English/Hebrew Michael — who is like God", county:"Antrim, Down, Cork", province:"Ulster & Munster", type:"Settler / Anglo-Norman", history:"Mitchell came to Ireland primarily through the Ulster Plantation as a Scottish and English settler name. However it is now well established across Ireland and deeply embedded in the culture of the provinces where it settled.", diaspora:"Mitchell is extremely common in the Irish-American and Irish-British communities from both Ulster and Munster emigration.", hook:"Mitchell came to Ireland with the Ulster Plantation — but it planted itself so deep that generations later it feels as Irish as any name on the island." },
  "montgomery":{ surname:"Montgomery", irish:"Munta Gómra", meaning:"From the Norman Mont Gomer — Gomeric's hill in Normandy", county:"Antrim, Down, Fermanagh", province:"Ulster", type:"Norman / Ulster Plantation", history:"The Montgomeries came to Ulster during the Plantation of the early 17th century. The town of Newtownards in County Down grew around the Montgomery settlement. Despite their plantation origins, the Ulster Montgomeries became deeply embedded in the culture of the province.", diaspora:"Montgomery is common in the Ulster diaspora in Scotland, Canada, and the United States.", hook:"The Montgomeries arrived in Ulster in the 17th century as planters on confiscated Irish land. Four hundred years later, the name is as Ulster as the hills themselves." },
  "norris":{ surname:"Norris", irish:"de Norreis", meaning:"From the Norman le Noreis — the northerner", county:"Cork, Munster", province:"Munster", type:"Norman", history:"The Norrises came to Ireland as Normans — their name simply meaning the northerner. They settled in Munster and became an established Cork family over centuries.", diaspora:"Norris is found in the Irish diaspora in Britain and the United States, concentrated from Munster emigration.", hook:"Norris literally means the northerner — your Norman ancestors were named for where they came from. They left Normandy, came to Ireland, and the direction they travelled became their name forever." },

const input = document.getElementById('surname-input');
const resultArea = document.getElementById('result-area');

input.addEventListener('keydown', e => { if (e.key === 'Enter') doLookup(); });

function quickLookup(name) { input.value = name; doLookup(); }

function clean(s) {
  return s.toLowerCase()
    .replace(/'/g,"").replace(/'/g,"")
    .replace(/[^a-z]/g,'');
}

function findEntry(raw) {
  const k = clean(raw);
  if (db[k]) return { type:'irish', data:db[k] };
  if (ni[k]) return { type:'notirish', note:ni[k] };
  // Try dropping leading O
  const noO = k.replace(/^o/,'');
  if (db['o'+noO]) return { type:'irish', data:db['o'+noO] };
  // Try mac/mc swap
  if (k.startsWith('mac') && db[k.replace(/^mac/,'mc')]) return { type:'irish', data:db[k.replace(/^mac/,'mc')] };
  if (k.startsWith('mc') && db[k.replace(/^mc/,'mac')]) return { type:'irish', data:db[k.replace(/^mc/,'mac')] };
  return null;
}

function doLookup() {
  const raw = input.value.trim();
  if (!raw) return;
  const found = findEntry(raw);
  if (!found) {
    resultArea.innerHTML = `<div class="error">We don't have <strong>${raw}</strong> in the database yet — we're adding surnames regularly. Check back soon or follow the page for updates! 🍀</div>`;
    return;
  }
  if (found.type === 'notirish') {
    resultArea.innerHTML = `<div class="not-irish"><strong>${raw}</strong> does not appear to be an Irish surname in origin.<br><br>${found.note}<br><br><em>If your family has Irish connections despite this surname, it may have come through the Ulster Plantation, marriage, or adoption. Many non-Irish names entered Ireland through settlement over the centuries.</em></div>`;
    return;
  }
  const r = found.data;
  resultArea.innerHTML = `
    <div class="result">
      <div class="result-header">
        <div class="result-surname">${r.surname}</div>
        <div class="result-irish">${r.irish}</div>
        <div class="tags">
          <span class="tag"><strong>County</strong>${r.county}</span>
          <span class="tag"><strong>Province</strong>${r.province}</span>
          <span class="tag"><strong>Origin</strong>${r.type}</span>
        </div>
      </div>
      <div class="section">
        <span class="section-label">Meaning</span>
        <p class="section-text">${r.meaning}</p>
      </div>
      <hr class="divider"/>
      <div class="section">
        <span class="section-label">Clan history</span>
        <p class="section-text">${r.history}</p>
      </div>
      <div class="section">
        <span class="section-label">Diaspora</span>
        <p class="section-text">${r.diaspora}</p>
      </div>
      <div class="hook-box">
        <span class="section-label">Did you know</span>
        <p class="hook-text">${r.hook}</p>
      </div>
    </div>`;
}
</script>

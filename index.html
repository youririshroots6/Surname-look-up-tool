<title>Irish Surname Lookup</title>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #F8F4ED; --parchment: #EDE8DC; --ink: #1C1710; --ink-mid: #4A3F2F;
    --ink-light: #8C7E6A; --gold: #A87C2A; --green: #2D5016; --green-light: #3D6B20;
    --border: #C8B99A; --border-light: #DDD0BA; --red-bg: #FDF5F5;
    --red-border: #D4A0A0; --red-text: #8B2020;
  }
  body { background: var(--cream); color: var(--ink); font-family: 'EB Garamond', serif; min-height: 100vh; }
  .page { max-width: 680px; margin: 0 auto; padding: 3rem 1.5rem 4rem; }
  header { text-align: center; margin-bottom: 2.5rem; padding-bottom: 2rem; border-bottom: 1px solid var(--border); position: relative; }
  header::after { content: '❧'; position: absolute; bottom: -14px; left: 50%; transform: translateX(-50%); background: var(--cream); padding: 0 12px; color: var(--gold); font-size: 20px; }
  .title { font-family: 'Cinzel', serif; font-size: 28px; font-weight: 700; color: var(--ink); letter-spacing: 0.06em; margin-bottom: 8px; }
  .subtitle { font-size: 16px; color: var(--ink-mid); font-style: italic; }
  .search-row { display: flex; gap: 10px; margin-bottom: 1rem; }
  input[type="text"] { flex: 1; font-family: 'EB Garamond', serif; font-size: 18px; padding: 12px 16px; border: 1px solid var(--border); border-radius: 4px; background: #fff; color: var(--ink); outline: none; transition: border-color 0.15s; }
  input[type="text"]:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(168,124,42,0.12); }
  input[type="text"]::placeholder { color: var(--ink-light); font-style: italic; }
  .lookup-btn { font-family: 'Cinzel', serif; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; padding: 12px 24px; border: 1px solid var(--gold); border-radius: 4px; background: var(--green); color: #fff; cursor: pointer; white-space: nowrap; transition: background 0.15s; }
  .lookup-btn:hover { background: var(--green-light); }
  .lookup-btn:active { transform: scale(0.98); }
  .examples { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 2rem; }
  .examples-label { font-size: 13px; color: var(--ink-light); font-style: italic; }
  .chip { font-family: 'EB Garamond', serif; font-size: 14px; padding: 4px 14px; border: 1px solid var(--border); border-radius: 99px; background: transparent; color: var(--ink-mid); cursor: pointer; transition: background 0.12s; }
  .chip:hover { background: var(--parchment); }
  .error { text-align: center; padding: 2rem; color: var(--red-text); font-style: italic; font-size: 16px; border: 1px solid var(--red-border); border-radius: 4px; background: var(--red-bg); }
  .not-irish { text-align: left; padding: 1.5rem; color: var(--ink-mid); font-size: 16px; border: 1px solid var(--border); border-radius: 4px; background: var(--parchment); line-height: 1.8; }
  .not-irish strong { color: var(--ink); font-weight: 500; }
  .result { animation: rise 0.35s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .result-header { margin-bottom: 1.5rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--border-light); }
  .result-surname { font-family: 'Cinzel', serif; font-size: 30px; font-weight: 700; color: var(--ink); letter-spacing: 0.04em; margin-bottom: 4px; }
  .result-irish { font-size: 17px; color: var(--ink-mid); font-style: italic; margin-bottom: 14px; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { font-size: 13px; padding: 4px 12px; border: 1px solid var(--border); border-radius: 3px; background: var(--parchment); color: var(--ink-mid); }
  .tag strong { color: var(--ink); font-weight: 500; margin-right: 4px; }
  .section { margin-bottom: 1.5rem; }
  .section-label { font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 0.14em; color: var(--gold); text-transform: uppercase; margin-bottom: 8px; display: block; }
  .section-text { font-size: 17px; line-height: 1.75; color: var(--ink); }
  .divider { border: none; border-top: 1px solid var(--border-light); margin: 1.5rem 0; }
  .hook-box { background: var(--green); border-radius: 4px; padding: 1.25rem 1.5rem; margin-top: 1.5rem; }
  .hook-box .section-label { color: rgba(255,255,255,0.6); margin-bottom: 10px; }
  .hook-text { font-size: 17px; line-height: 1.65; color: #fff; font-style: italic; }
  .count-note { font-size: 13px; color: var(--ink-light); font-style: italic; text-align: center; margin-bottom: 1.5rem; }
  footer { text-align: center; margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--border-light); font-size: 13px; color: var(--ink-light); font-style: italic; }
</style>

<body>
<div class="page">

    <h1 class="title">Irish Surname Lookup</h1>

  <p class="count-note">Over 100 surnames in the database — more added regularly</p>
  <div id="result-area"></div>
  <footer>Irish Surnames, Clans &amp; Legends &nbsp;·&nbsp; Every name tells a story</footer>

  "kileen":"Variant of Killeen — from the Irish Ó Caoileáin, meaning descendant of the slender one. Found in Connacht.",

  "mckenney":"Variant spelling of McKenna — search McKenna for the full history.",

const db = {
  "murphy":{ surname:"Murphy", irish:"Ó Murchadha", meaning:"Descendant of Murchadh — sea warrior", county:"Wexford, Cork, Down", province:"Leinster & Munster", type:"Gaelic Irish", history:"Murphy is the most common surname in Ireland and has been since records began. The MacMurrough dynasty ruled Wexford as kings of Leinster, and it was Diarmait MacMurchada who controversially invited the Normans to Ireland in 1169 — an act that changed Irish history forever. The name never readopted its Ó prefix after British rule stripped it away.", diaspora:"Murphy is the most common Irish surname in the United States, with particularly strong concentrations in Boston, New York, and Chicago.", hook:"The most common Irish surname in the world means sea warrior. And the man who bore it most famously invited England into Ireland — and changed everything." },
  "kelly":{ surname:"Kelly", irish:"Ó Ceallaigh", meaning:"Descendant of Ceallach — bright-headed or warrior", county:"Galway, Roscommon, Meath", province:"Connacht & Leinster", type:"Gaelic Irish", history:"The O'Kellys were kings of Uí Maine in Connacht, one of the great royal families of medieval Ireland. They ruled a territory covering most of modern Galway and Roscommon for centuries. The name is now one of the most common in Ireland and the diaspora, found in every county and corner of the world.", diaspora:"Kelly is among the top five Irish surnames in Australia, immortalised by bushranger Ned Kelly whose family emigrated from Tipperary.", hook:"Kelly is one of Ireland's most common names. But the family it comes from were kings — and they ruled Connacht for five hundred years." },
  "obrien":{ surname:"O'Brien", irish:"Ó Briain", meaning:"Descendant of Brian — noble or high", county:"Clare, Tipperary, Limerick", province:"Munster", type:"Gaelic Irish", history:"The O'Briens descend directly from Brian Boru, the High King of Ireland who defeated the Vikings at the Battle of Clontarf in 1014. After Brian's death at Clontarf — killed the day of his greatest victory — the O'Brien dynasty continued to rule Munster for centuries from their stronghold in Thomond, modern County Clare.", diaspora:"O'Brien is one of the most recognised Irish surnames in North America, with large concentrations in Massachusetts and New York tracing back to Munster emigration during the Famine.", hook:"Your surname descends from the man who drove the Vikings out of Ireland. Brian Boru won the battle — and was killed the same day." },
  "osullivan":{ surname:"O'Sullivan", irish:"Ó Súilleabháin", meaning:"Descendant of Súilleabhán — dark-eyed one", county:"Cork, Kerry", province:"Munster", type:"Gaelic Irish", history:"The O'Sullivans are one of the great Munster dynasties, ruling the Beara Peninsula in Cork and Kerry for centuries. After the Battle of Kinsale in 1601, Donal Cam O'Sullivan Beare led the last great march of an Irish clan army — walking over 500 kilometres through winter from Beara to Leitrim with 1,000 followers. Only 35 survived.", diaspora:"O'Sullivan is concentrated in the southwest of Ireland to this day, with the diaspora heavily represented in New York and Massachusetts.", hook:"After the final defeat of Gaelic Ireland, the O'Sullivan chief walked 500 kilometres through winter with a thousand people. Thirty-five survived. That is where your name comes from." },
  "walsh":{ surname:"Walsh", irish:"Breathnach", meaning:"Welshman — a settler of Welsh origin", county:"Mayo, Kilkenny, Waterford", province:"Connacht & Leinster", type:"Norman-Welsh", history:"Walsh is one of Ireland's most common surnames yet it is not Gaelic in origin. It was given to Welsh soldiers and settlers who came to Ireland with the Norman invasion of 1169. Despite its non-Gaelic origins, Walsh has been in Ireland for over 850 years and is now considered one of the most Irish of all names.", diaspora:"Walsh is widespread across the Irish diaspora in the United States, United Kingdom, and Australia, particularly in areas of heavy Famine emigration from Connacht.", hook:"One of the most common Irish surnames in the country isn't actually Irish at all. Walsh means Welshman — and your ancestors arrived with the Norman invasion in 1169." },
  "byrne":{ surname:"Byrne", irish:"Ó Broin", meaning:"Descendant of Bran — raven", county:"Wicklow, Wexford, Dublin", province:"Leinster", type:"Gaelic Irish", history:"The O'Byrnes were the ruling clan of Wicklow, fierce defenders of their mountain territory against English expansion. In parts of south Wicklow there are so many Byrne families they are still distinguished by nicknames — the rabbits, the badgers, the hares — all from the same ancient clan.", diaspora:"Byrne is one of the most common surnames in Dublin and is heavily represented in the Irish diaspora in Britain and the United States.", hook:"In one part of Wicklow there are so many families with your surname they had to give them animal nicknames to tell them apart. The rabbits. The badgers. The hares. All Byrnes. All from the same mountain clan." },
  "mccarthy":{ surname:"McCarthy", irish:"Mac Cárthaigh", meaning:"Son of Carthach — loving", county:"Cork, Kerry", province:"Munster", type:"Gaelic Irish", history:"The McCarthys were the Kings of Munster. After the Norman invasion pushed them from Tipperary they relocated to Cork and Kerry where they built one of the most powerful Gaelic kingdoms in Ireland. Blarney Castle — home of the famous Stone — was a McCarthy stronghold.", diaspora:"About 60% of all McCarthys in Ireland today are still in Cork, and the diaspora is heavily concentrated in the northeastern United States.", hook:"Your ancestors were the Kings of Munster. They built Blarney Castle. And after 900 years, 60% of McCarthys are still within 50 miles of where the clan began." },
  "gallagher":{ surname:"Gallagher", irish:"Ó Gallchobhair", meaning:"Descendant of Gallchobhar — eager helper", county:"Donegal", province:"Ulster", type:"Gaelic Irish", history:"The Gallaghers were the hereditary marshals of the O'Donnell clan — their role was military leadership, leading the O'Donnell armies into battle for generations. Donegal remains the heartland of the name, still the most common surname in the county.", diaspora:"Gallagher is strongly associated with the Ulster diaspora, with large concentrations in Scotland particularly Glasgow.", hook:"Your surname means your ancestors were the professional army commanders of Ulster. Not just soldiers — the family whose entire purpose was to lead the clan to war." },
  "oneill":{ surname:"O'Neill", irish:"Ó Néill", meaning:"Descendant of Niall — champion", county:"Tyrone, Antrim, Donegal", province:"Ulster", type:"Gaelic Irish", history:"The O'Neills were the most powerful Gaelic dynasty in Ulster, claiming descent from Niall of the Nine Hostages. Hugh O'Neill led the Nine Years War against Elizabeth I in the 1590s — the closest Ireland ever came to defeating English rule. After defeat he fled in the Flight of the Earls in 1607, ending the Gaelic order forever.", diaspora:"O'Neill is widespread across the Irish diaspora with particularly strong presence in the United States, Canada, and Australia.", hook:"Your surname claims descent from the High King of Ireland. And the last great O'Neill came within a breath of defeating Elizabeth I and driving England out of Ireland forever." },
  "doyle":{ surname:"Doyle", irish:"Ó Dubhghaill", meaning:"Descendant of Dubhghall — dark stranger", county:"Wicklow, Wexford, Dublin", province:"Leinster", type:"Viking-Irish", history:"Doyle is one of the few Irish surnames that carries Viking blood in its very meaning. Dubhghall was the Irish name given to the dark-haired Danish Vikings who settled along the east coast. The Doyles of Wicklow descend from those Viking settlers who intermarried with the Gaelic Irish over generations.", diaspora:"Doyle is common throughout the English-speaking diaspora, particularly in Britain and the east coast of the United States.", hook:"Your Irish surname is actually Viking. Doyle means dark foreigner — the name the Irish gave to the Danish warriors who sailed in from Scandinavia and never left." },
  "kennedy":{ surname:"Kennedy", irish:"Ó Cinnéidigh", meaning:"Descendant of Cinnéidigh — ugly head or helmeted head", county:"Tipperary, Clare, Antrim", province:"Munster", type:"Gaelic Irish", history:"The Kennedys were a powerful Munster clan, a branch of the Dal Cais dynasty that produced Brian Boru. President John F. Kennedy's family emigrated from Dunganstown, County Wexford in the 1840s — a fact that became internationally famous when JFK visited the homestead in 1963, just months before his assassination.", diaspora:"The Kennedy name is perhaps the most famous Irish surname in the world due to the American political dynasty, with roots traceable to County Wexford.", hook:"Kennedy means ugly head in Old Irish. The most famous family to bear it became the closest thing America ever had to royalty." },
  "ryan":{ surname:"Ryan", irish:"Ó Riain", meaning:"Descendant of Rian — little king", county:"Tipperary, Limerick, Carlow", province:"Munster", type:"Gaelic Irish", history:"The Ryans were a significant Munster clan in Tipperary and Limerick, landowners and chieftains in the fertile Golden Vale. The name is one of the most common in Munster and has been for centuries.", diaspora:"Ryan is one of the most common Irish surnames in Australia and the United States, with strong Munster emigration communities in both countries.", hook:"Ryan means little king in Old Irish. There were thousands of them — chieftains of the Golden Vale who held some of the richest farmland in all of Ireland." },
  "oconnor":{ surname:"O'Connor", irish:"Ó Conchobhair", meaning:"Descendant of Conchobar — lover of hounds", county:"Roscommon, Galway, Clare", province:"Connacht", type:"Gaelic Irish", history:"The O'Connors were the Kings of Connacht and the last true High Kings of Ireland. Rory O'Connor was the final High King before the Norman invasion of 1169 permanently ended the Gaelic kingship system. Their ancient inauguration site at Carnfree in Roscommon is still visible today.", diaspora:"O'Connor is widespread throughout the Irish diaspora, with strong communities in the United States, Britain, and Argentina.", hook:"The O'Connors were the last High Kings of Ireland. And the Norman invasion that ended their reign was invited in — by another Irishman." },
  "reilly":{ surname:"Reilly", irish:"Ó Raghallaigh", meaning:"Descendant of Raghallach — race valour", county:"Cavan, Meath, Westmeath", province:"Ulster & Leinster", type:"Gaelic Irish", history:"The O'Reillys were the ruling clan of East Breifne, the territory of modern County Cavan. The phrase 'the real O'Reilly' — meaning the genuine article — entered English from their reputation as the true rulers of their territory.", diaspora:"Reilly and O'Reilly are common throughout the Irish-American community, with strong concentrations in New York and the northeastern United States.", hook:"The phrase the real O'Reilly comes from your clan. They were so dominant in Cavan that their name became a byword for authenticity itself." },
  "doherty":{ surname:"Doherty", irish:"Ó Dochartaigh", meaning:"Descendant of Dochartach — obstructive", county:"Donegal, Derry", province:"Ulster", type:"Gaelic Irish", history:"The Dohertys were the Lords of Inishowen, the most northerly peninsula of Ireland, and close allies of the O'Neill dynasty. The name means obstructive — reflecting the family's fierce reputation as warriors defending the extreme north of Ireland.", diaspora:"Doherty is strongly associated with the Ulster diaspora in Scotland and the United States, with particularly dense communities in Glasgow and Philadelphia.", hook:"Your surname literally means obstructive — because the clan that bore it spent centuries blocking every attempt to take the northern tip of Ireland from them." },
  "mcdonnell":{ surname:"McDonnell", irish:"Mac Domhnaill", meaning:"Son of Domhnall — world mighty", county:"Antrim, Galway, Mayo", province:"Ulster & Connacht", type:"Gaelic Irish / Scottish Gallowglass", history:"The McDonnells of Antrim were the most powerful Scottish-Irish clan in Ulster, fierce gallowglass warriors who became Lords of the Glens of Antrim. Sorley Boy McDonnell was one of the most formidable opponents Elizabeth I faced in Ireland — and despite her best efforts she never fully defeated him.", diaspora:"McDonnell is common throughout the Irish and Scottish diaspora, particularly in Canada and the United States.", hook:"The McDonnells were Scottish warriors who came to Ireland and became more Irish than the Irish themselves. Elizabeth I tried for decades to destroy them. She never managed it." },
  "moore":{ surname:"Moore", irish:"Ó Mórdha", meaning:"Descendant of Mórdha — stately or noble", county:"Laois, Kildare, Tyrone", province:"Leinster & Ulster", type:"Gaelic Irish", history:"The O'Moores were the ruling clan of Laois, fierce resisters of English colonisation. Rory Óg O'More was the greatest obstacle to Elizabeth I's conquest of the midlands — eventually betrayed, his head displayed on a spike at Dublin Castle. His nephew masterminded the 1641 rebellion that nearly drove England out of Ireland.", diaspora:"Moore is widespread throughout the Irish diaspora in the United States, Britain, and Australia.", hook:"The O'Moores of Laois fought English rule so fiercely that Elizabeth I had a personal obsession with destroying them. When they finally caught Rory Óg, they put his head on a spike at Dublin Castle." },
  "quinn":{ surname:"Quinn", irish:"Ó Cuinn", meaning:"Descendant of Conn — chief or leader", county:"Tyrone, Antrim, Clare", province:"Ulster", type:"Gaelic Irish", history:"The Quinns were an important Ulster clan, closely connected to the great O'Neill dynasty of Tyrone. They were part of the network of families that supported and served the O'Neill kings for generations.", diaspora:"Quinn is common throughout the Irish diaspora in the United States and Britain, particularly associated with Ulster emigration communities.", hook:"Quinn means chief or leader — and for generations the family who bore it stood at the right hand of the most powerful dynasty in all of Ulster." },
  "brennan":{ surname:"Brennan", irish:"Ó Braonáin", meaning:"Descendant of Braonán — moisture or drop", county:"Kilkenny, Tipperary, Roscommon", province:"Leinster & Connacht", type:"Gaelic Irish", history:"The Brennans were a significant Leinster clan in Kilkenny and Tipperary. St Brendan the Navigator — one of Ireland's greatest early Christian figures who may have sailed to America a thousand years before Columbus — bore a closely related name.", diaspora:"Brennan is common throughout the Irish-American community with strong representation in the northeastern United States.", hook:"Your surname connects to one of the most extraordinary journeys in history — the voyage of St Brendan, who may have sailed to America a thousand years before Columbus." },
  "power":{ surname:"Power", irish:"de Paor", meaning:"From the Norman le pauvre — the poor one, a term of humility", county:"Waterford, Kilkenny, Wexford", province:"Munster & Leinster", type:"Norman", history:"Power is one of the great Norman surnames of Ireland, brought by knights who came with Strongbow in 1169. Despite Norman origins the Power family became deeply Gaelicised. Their heartland of Waterford and Kilkenny remains Power country to this day.", diaspora:"Power is common in the Irish diaspora in Britain, the United States, and Australia.", hook:"Power is one of Ireland's most common surnames. But it means the poor one in Norman French — a term of humility that knights used to show they fought for God, not glory." },
  "maguire":{ surname:"Maguire", irish:"Mac Uidhir", meaning:"Son of Odhar — pale or dun-coloured", county:"Fermanagh", province:"Ulster", type:"Gaelic Irish", history:"The Maguires were the Kings of Fermanagh for over 300 years. They first appeared in the Annals of Ulster in 956 AD and built a network of crannógs — lake island fortresses — across the stunning Fermanagh lakeland.", diaspora:"Maguire is strongly associated with Fermanagh and the broader Ulster diaspora in the United States and Canada.", hook:"The Maguires ruled Fermanagh for 300 years from island castles in the middle of its lakes. Your ancestors were lords of one of the most beautiful territories in all of Ireland." },
  "fitzgerald":{ surname:"FitzGerald", irish:"Mac Gearailt", meaning:"Son of Gerald — spear ruler", county:"Kildare, Kerry, Limerick", province:"Leinster & Munster", type:"Norman", history:"The FitzGeralds arrived with Strongbow in 1169 and became so Gaelicised they were described as more Irish than the Irish themselves. The Earls of Kildare were effectively the rulers of Ireland for much of the 15th century, more powerful than the English Crown itself.", diaspora:"FitzGerald is common throughout the Irish diaspora, particularly in the United States where President JFK had FitzGerald ancestry on his mother's side.", hook:"The FitzGeralds came to Ireland as Norman conquerors in 1169. Within two centuries they had become so Irish that they led rebellions against the very English Crown that sent their ancestors here." },
  "burke":{ surname:"Burke", irish:"de Búrca", meaning:"From the Norman de Burgh — of the fortress", county:"Galway, Mayo, Tipperary", province:"Connacht & Munster", type:"Norman", history:"The Burkes descended from William de Burgh, one of the most powerful Norman lords in Ireland. Like the FitzGeralds they became thoroughly Gaelicised and were considered as dangerous to English rule as any Gaelic clan.", diaspora:"Burke is common throughout the Irish diaspora in the United States, Britain, and Australia.", hook:"Burke came to Ireland as a Norman conqueror. Within a generation the family had gone so native that England considered them as dangerous as any Gaelic clan." },
  "farrell":{ surname:"Farrell", irish:"Ó Fearghail", meaning:"Descendant of Fearghal — man of valour", county:"Longford, Roscommon, Westmeath", province:"Leinster & Connacht", type:"Gaelic Irish", history:"The O'Farrells were the ruling clan of Annaly, the ancient territory of County Longford. They were a significant midlands dynasty who maintained their power through centuries of Norman and English pressure.", diaspora:"Farrell is common throughout the Irish-American community and in Britain.", hook:"Farrell means man of valour — and the clan that bore it ruled the midlands of Ireland for so long that the county they controlled still carries their mark today." },
  "hayes":{ surname:"Hayes", irish:"Ó hAodha", meaning:"Descendant of Aodh — fire", county:"Tipperary, Limerick, Cork", province:"Munster", type:"Gaelic Irish", history:"Hayes is the anglicisation of Ó hAodha, meaning descendant of the fire god Aodh. Interestingly, the same Irish name was anglicised as Hughes in Ulster — so Hayes in Munster and Hughes in Ulster are the exact same ancient name.", diaspora:"Hayes is common throughout the Irish-American community, particularly in the northeastern United States.", hook:"Hayes means fire in Old Irish. And the exact same name in a different county became Hughes. Same ancestor — two completely different surnames." },
  "omalley":{ surname:"O'Malley", irish:"Ó Máille", meaning:"Descendant of the chief", county:"Mayo", province:"Connacht", type:"Gaelic Irish", history:"The O'Malleys were the great seafaring clan of Connacht. Their most famous member was Grace O'Malley — Gráinne Mhaol — the Pirate Queen who commanded a fleet of ships and famously met Queen Elizabeth I face to face as an equal in 1593, negotiating in Irish without a translator.", diaspora:"O'Malley is associated with the Connacht diaspora, with strong communities in the United States particularly in Boston and New York.", hook:"The O'Malleys were the pirate clan of the west coast of Ireland. Their queen sailed to London, walked into Elizabeth I's palace, and negotiated as an equal. In Irish. Without a translator." },
  "nolan":{ surname:"Nolan", irish:"Ó Nualláin", meaning:"Descendant of Nuallán — noble or famous", county:"Carlow, Wexford, Kildare", province:"Leinster", type:"Gaelic Irish", history:"The O'Nolans were the ruling clan of Forth in County Carlow. The barony is still named after them to this day. They were one of the principal Leinster families, holding their territory against both Norman and English pressure for centuries.", diaspora:"Nolan is common in the Irish diaspora in Britain, the United States, and Australia.", hook:"The barony that your clan ruled in Ireland is still called Forth — from Ó Nualláin — after all these centuries. Your ancestors named the land and the land remembered." },
  "carroll":{ surname:"Carroll", irish:"Ó Cearbhaill", meaning:"Descendant of Cearbhall — fierce in battle", county:"Offaly, Tipperary, Monaghan", province:"Leinster & Munster", type:"Gaelic Irish", history:"The Ely O'Carrolls of Offaly ruled their territory with remarkable independence well into the 17th century. Charles Carroll of Carrollton was the only Catholic signatory of the American Declaration of Independence in 1776.", diaspora:"Carroll is widespread in the Irish-American community, with the Maryland Catholic community having particularly deep roots in the name.", hook:"One man with your surname was the only Catholic to sign the American Declaration of Independence. Charles Carroll risked everything — and his family had already lost it all once, in Ireland." },
  "mcdermott":{ surname:"McDermott", irish:"Mac Diarmada", meaning:"Son of Diarmaid — free man", county:"Roscommon, Sligo", province:"Connacht", type:"Gaelic Irish", history:"The MacDermotts were the Kings of Moylurg in Roscommon. They ruled from the Rock of Lough Key, an island fortress on one of Ireland's most beautiful lakes, and maintained their Gaelic identity longer than most.", diaspora:"McDermott is common in the Irish diaspora in the United States and Britain, particularly associated with Connacht emigration.", hook:"Your ancestors were kings of Connacht who ruled from a castle on an island in the middle of a lake. The Rock of Lough Key still stands — you can visit it today." },
  "flanagan":{ surname:"Flanagan", irish:"Ó Flannagáin", meaning:"Descendant of Flannagán — red or ruddy", county:"Roscommon, Fermanagh, Offaly", province:"Connacht & Ulster", type:"Gaelic Irish", history:"The Flanagans were established in at least three provinces. The name refers to a red-haired or ruddy ancestor. The Flanagans of Fermanagh were closely associated with the Maguire kings.", diaspora:"Flanagan is common throughout the Irish diaspora in the United States and Britain.", hook:"Flanagan means red one — your ancestors were so defined by one man's red hair that they named an entire dynasty after it, and it survived a thousand years." },
  "orourke":{ surname:"O'Rourke", irish:"Ó Ruairc", meaning:"Descendant of Ruarc — champion", county:"Leitrim, Cavan", province:"Connacht", type:"Gaelic Irish", history:"The O'Rourkes were the Kings of Breifne. Tiernan O'Rourke holds a unique place in history — his wife was taken by Diarmait MacMurrough in 1152, and O'Rourke's desire for revenge contributed to the chain of events that led to the Norman invasion of Ireland in 1169.", diaspora:"O'Rourke is associated with the Connacht diaspora, with communities in the United States, Britain, and Australia.", hook:"The Norman invasion of Ireland — the event that shaped the next 800 years — started with an O'Rourke. His wife was taken. His revenge changed everything." },
  "higgins":{ surname:"Higgins", irish:"Ó hUiginn", meaning:"Descendant of Uiginn — possibly from a Viking name meaning thought", county:"Sligo, Westmeath, Mayo", province:"Connacht", type:"Gaelic Irish", history:"The O'Higgins were hereditary poets and historians of the O'Connor and MacDermott kings of Connacht. Bernardo O'Higgins, descended from an Irish emigrant from Sligo, became the founding father and first leader of independent Chile.", diaspora:"The most famous O'Higgins in history was Bernardo O'Higgins, liberator of Chile, whose father emigrated from Sligo in the 18th century.", hook:"Your surname belonged to the royal poets of Connacht. And one descendant went to South America and freed a country." },
  "lynch":{ surname:"Lynch", irish:"Ó Loingsigh", meaning:"Descendant of Loingseach — mariner or exile", county:"Galway, Clare, Mayo", province:"Connacht", type:"Norman-Gaelic", history:"The Lynches were one of the fourteen Tribes of Galway. James Lynch FitzStephen, mayor of Galway in 1493, famously hanged his own son for murder when no one else would carry out the sentence — giving rise to the term Lynch law.", diaspora:"Lynch is common throughout the Irish diaspora in the United States, Britain, and Australia.", hook:"Lynch law — the phrase the whole world uses — may have started with a Galway mayor who hanged his own son rather than let a murderer go free. That was your clan." },
  "connolly":{ surname:"Connolly", irish:"Ó Conghaile", meaning:"Descendant of Conghal — fierce as a hound", county:"Galway, Monaghan, Fermanagh", province:"Connacht & Ulster", type:"Gaelic Irish", history:"James Connolly co-led the 1916 Easter Rising. Wounded during the Rising, he was tied to a chair and executed because he was too injured to stand. He faced the firing squad sitting down.", diaspora:"Connolly is common in the Irish diaspora in Britain and the United States, deeply associated with the labour movement.", hook:"James Connolly fought for Irish freedom in 1916. He was so badly wounded they had to tie him to a chair to shoot him. He faced the firing squad sitting down." },
  "barry":{ surname:"Barry", irish:"de Barra", meaning:"From the Norman de Barri — of the rampart", county:"Cork, Tipperary", province:"Munster", type:"Norman", history:"The Barrys came to Ireland as Normans with Strongbow in 1169 and became one of the most powerful families in Cork. Their territory in Cork is still called Barrymore — the great Barry. The famous Hollywood Barrymore dynasty took their stage name from this Irish Norman connection.", diaspora:"Barry is common in the Irish diaspora in the United States and Britain, with the Hollywood Barrymore dynasty a famous example.", hook:"The Barrymores — one of Hollywood's most famous dynasties — took their name from a piece of Cork that Norman settlers called their own in 1169. Your surname built a castle and gave it to the movies." },
  "oleary":{ surname:"O'Leary", irish:"Ó Laoghaire", meaning:"Descendant of Laoghaire — calf herder", county:"Cork", province:"Munster", type:"Gaelic Irish", history:"Art O'Leary was killed in 1773 for refusing to sell his horse to a Protestant for five pounds as required by the Penal Laws. His wife Eibhlín Dubh Ní Chonaill composed the Caoinedah Airt Uí Laoghaire — considered one of the greatest poems ever written in the Irish language.", diaspora:"O'Leary is common throughout the Irish diaspora in the United States, Britain, and Australia.", hook:"An O'Leary was murdered under British law for refusing to sell his horse. His wife's lament for him became one of the greatest poems ever written in the Irish language." },
  "moran":{ surname:"Moran", irish:"Ó Móráin", meaning:"Descendant of Morán — great one", county:"Mayo, Roscommon, Galway", province:"Connacht", type:"Gaelic Irish", history:"In ancient Irish legend, Morann mac Máin was a great judge who wore a magical torque that tightened around his neck if he gave an unjust verdict. Your surname carries his name — the man who literally could not be unjust.", diaspora:"Moran is common throughout the Irish-American community, particularly in areas of heavy Connacht emigration.", hook:"In ancient Irish legend, a man named Morann wore a magical collar that strangled him if he told a lie. Your surname carries his name — the man who literally could not be unjust." },
  "plunkett":{ surname:"Plunkett", irish:"Pluincéad", meaning:"Norman origin, possibly from a place name", county:"Meath, Dublin, Louth", province:"Leinster", type:"Norman", history:"Saint Oliver Plunkett, Archbishop of Armagh, was martyred in 1681 — the last Catholic martyr to die in England. His preserved head is kept in St Peter's Church in Drogheda to this day.", diaspora:"Plunkett is associated with the Old English Catholic community of Leinster and their diaspora in the United States and Australia.", hook:"Saint Oliver Plunkett was the last Catholic martyr executed in England. His head has been on display in an Irish church since 1681 — and people still visit it today." },
  "mckenna":{ surname:"McKenna", irish:"Mac Cionaoith", meaning:"Son of Cionaodh — beloved of the fire god Aodh", county:"Monaghan, Tyrone", province:"Ulster", type:"Gaelic Irish", history:"The McKennas were the Lords of Truagh in north County Monaghan for five hundred years. Their last stand — the Battle of Drumbanagher in 1688 — is still called McKenna's Last Stand in local memory. After defeat their lands were confiscated but the name survived and McKenna is still the second most common surname in all of Monaghan.", diaspora:"McKenna is common throughout the Irish-American and Irish-Canadian communities, particularly associated with Ulster emigration.", hook:"McKenna means beloved of the fire god. Your clan ruled the same hill fort in Monaghan for five hundred years — and their last battle is still called McKenna's Last Stand." },
  "odonnell":{ surname:"O'Donnell", irish:"Ó Domhnaill", meaning:"Descendant of Domhnall — world mighty", county:"Donegal", province:"Ulster", type:"Gaelic Irish", history:"The O'Donnells were undisputed lords of Tyrconnell — modern Donegal — for over four centuries. Red Hugh O'Donnell was kidnapped and imprisoned in Dublin Castle at age 15. He escaped through the Wicklow Mountains in winter, led the Nine Years War alongside the O'Neills, and came within a single battle of driving England out of Ireland. He died in Spain at 29, allegedly poisoned by an English spy.", diaspora:"O'Donnell is widespread across the Irish diaspora in the United States, Australia, and Argentina, with Donegal roots throughout.", hook:"Red Hugh O'Donnell was kidnapped at 15, escaped through the Wicklow Mountains in winter, and nearly drove England out of Ireland forever. He was 29 when he died — allegedly poisoned by a spy." },
  "tyrrell":{ surname:"Tyrrell", irish:"Tirial", meaning:"From the Norman Tirel — possibly stubborn", county:"Westmeath, Meath", province:"Leinster", type:"Norman", history:"The Tyrells were a powerful Norman family who settled in Westmeath after 1169 and became lords of Fertullagh. Walter Tirel is historically associated with the death of King William Rufus of England in 1100 — his arrow allegedly killed the king in a hunting accident, though Tirel always denied it.", diaspora:"Tyrrell is found in the Irish diaspora in Britain, the United States, and Australia.", hook:"The Tyrrells came to Ireland as Norman lords. But before that, one of their ancestors may have accidentally — or deliberately — shot the King of England with an arrow." },
  "fitzpatrick":{ surname:"Fitzpatrick", irish:"Mac Giolla Phádraig", meaning:"Son of the servant of Saint Patrick", county:"Laois, Kilkenny", province:"Leinster", type:"Gaelic Irish with Norman prefix", history:"Fitzpatrick is unique — the only Irish Fitz- surname that is Gaelic rather than Norman in origin. The Fitzpatricks were the kings of Ossory. They were the only Gaelic Irish family to adopt the Norman Fitz- prefix, meaning son of, rather than Mac.", diaspora:"Fitzpatrick is common in the Irish diaspora in the United States and Britain, associated with Leinster emigration.", hook:"Fitzpatrick is the only Irish name with a Norman Fitz prefix that is actually Gaelic. And what it means is son of the servant of Saint Patrick. Your ancestors named themselves after Ireland's patron saint." },
  "reynolds":{ surname:"Reynolds", irish:"Mac Raghnaill", meaning:"Son of Raghnall — mighty power, from a Norse name", county:"Leitrim, Roscommon", province:"Connacht", type:"Gaelic Irish / Norse-Gaelic", history:"The Mac Ragnalls were descended from Raghnall, a Norse-Gaelic name that came to Ireland through the Vikings. They were a significant family in Leitrim and Roscommon, part of the Connacht clan system.", diaspora:"Reynolds is common in the Irish-American community, particularly from Connacht emigration.", hook:"Reynolds sounds completely English. But it comes from a Norse name brought to the west of Ireland by Viking settlers — and the family ruled Connacht for centuries." },
  "corcoran":{ surname:"Corcoran", irish:"Ó Corcráin", meaning:"Descendant of Corcrán — purple or ruddy one", county:"Offaly, Roscommon, Mayo", province:"Leinster & Connacht", type:"Gaelic Irish", history:"The Corcorans were a midlands clan in Offaly with a separate branch in Connacht. The Corcoran Gallery of Art in Washington DC was founded by Irish-American banker William Wilson Corcoran — one of the most significant art institutions in the United States bears your name.", diaspora:"Corcoran is found in the Irish-American community, most famously in the name of the Corcoran Gallery of Art in Washington DC.", hook:"The Corcoran Gallery in Washington DC — one of America's oldest art museums — bears your surname. Its founder's family came from the midlands of Ireland." },
  "mclaughlin":{ surname:"McLaughlin", irish:"Mac Lochlainn", meaning:"Son of Lochlann — land of the Vikings", county:"Donegal, Derry, Tyrone", province:"Ulster", type:"Gaelic Irish", history:"The Mac Lochlainns were one of Ulster's most powerful dynasties, a branch of the great Uí Néill family. They were Kings of Ailech and at their height in the 12th century produced High Kings of Ireland. The name literally means son of the Viking lands.", diaspora:"McLaughlin is strongly associated with the Ulster diaspora in Scotland, the United States, and Canada.", hook:"McLaughlin literally means son of the Viking lands. Your Gaelic Irish ancestors were so shaped by their Norse neighbours that they built the Vikings into their own name." },
  "boyle":{ surname:"Boyle", irish:"Ó Baoighill", meaning:"Descendant of Baoigheall — vain pledge", county:"Donegal, Roscommon, Sligo", province:"Ulster & Connacht", type:"Gaelic Irish", history:"The O'Boyles were one of the three great clans of Donegal alongside the O'Donnells and O'Dohertys. They were hereditary keepers of the Cathach — a psalter believed to have been written by St Columba himself, carried into battle as a protective talisman. It survives today in the Royal Irish Academy in Dublin.", diaspora:"Boyle is common in the Ulster and Connacht diaspora across the United States and Britain.", hook:"The O'Boyles were the guardians of one of Ireland's most sacred relics — a book written by St Columba that was carried into battle for centuries. That book still exists today." },
  "hogan":{ surname:"Hogan", irish:"Ó hÓgáin", meaning:"Descendant of Ógán — young warrior", county:"Tipperary, Clare, Cork", province:"Munster", type:"Gaelic Irish", history:"The Hogans were a Munster clan, a branch of the Dal Cais dynasty that also produced Brian Boru and the Kennedys. They were significant landowners in Tipperary and Clare.", diaspora:"Hogan is common in the Irish-American community, well known through professional wrestler Hulk Hogan whose real surname is the same.", hook:"Hogan means young warrior — and your clan shares its ancient bloodline with Brian Boru, the High King who drove the Vikings out of Ireland at the Battle of Clontarf." },
  "shea":{ surname:"Shea", irish:"Ó Séaghdha", meaning:"Descendant of Séaghdha — hawk-like or stately", county:"Kerry, Cork, Tipperary", province:"Munster", type:"Gaelic Irish", history:"The O'Sheas were a significant Kerry clan, particularly concentrated in the Iveragh Peninsula. Shea and O'Shea are variants of the same name, many families having dropped the O prefix under British pressure.", diaspora:"Shea is common in the Irish-American community, particularly in areas of Munster emigration such as Boston and New York.", hook:"Shea means hawk-like — sharp, watchful, fierce. Your Kerry ancestors chose that name for a reason, and they carried it through centuries of English rule without letting it go." },
  "mcginley":{ surname:"McGinley", irish:"Mag Fhionnlaoich", meaning:"Son of Fionnlaoch — fair hero", county:"Donegal", province:"Ulster", type:"Gaelic Irish", history:"The McGinleys are a Donegal clan, deeply rooted in the county that remains their heartland today. The name is so strongly concentrated in Donegal that it is rarely found outside Ulster.", diaspora:"McGinley is associated with Donegal emigration communities in Scotland, the United States, and Britain.", hook:"McGinley means son of the fair hero — and the clan that bears it is so rooted in Donegal that you can still find the vast majority of them within fifty miles of where the name began." },
  "mcmahon":{ surname:"McMahon", irish:"Mac Mathghamhna", meaning:"Son of Mathghamhan — bear or great warrior", county:"Clare, Monaghan", province:"Munster & Ulster", type:"Gaelic Irish", history:"There were two powerful McMahon clans — the MacMahons of Monaghan who were kings of Oriel in Ulster, and the MacMahons of Clare in Munster. Marshal Marie Edme Patrice de MacMahon became President of France in 1873 — his family were Wild Geese who fled Ireland after the Jacobite defeat.", diaspora:"McMahon is common throughout the Irish diaspora, and the family's most famous scion became President of France.", hook:"Your surname means bear or great warrior. And one of your name became President of France — his grandfather had fled Ireland as one of the Wild Geese after the Jacobite defeat." },
  "sweeney":{ surname:"Sweeney", irish:"Mac Suibhne", meaning:"Son of Suibhne — pleasant or well-going", county:"Donegal, Cork, Kerry", province:"Ulster & Munster", type:"Gaelic Irish / Scottish Gallowglass", history:"The MacSweeneys were gallowglass warriors — professional soldiers from Scotland who came to serve Irish chieftains. They became one of the most feared fighting families in Ireland, serving the O'Donnells as their chief military commanders.", diaspora:"Sweeney is common throughout the Irish diaspora in the United States, Britain, and Australia.", hook:"The Sweeneys were professional warriors for hire — the most feared soldiers in medieval Ireland. They came from Scotland, pledged their swords to Donegal, and never left." },
  "donovan":{ surname:"Donovan", irish:"Ó Donnabháin", meaning:"Descendant of Donnabhan — dark warrior", county:"Cork, Limerick, Kerry", province:"Munster", type:"Gaelic Irish", history:"The O'Donovans were originally powerful in Limerick before being pushed south into Cork by the O'Briens. They settled in the Carbery region of west Cork, built Donovan's castle, and ruled as lords for centuries. The name is still strongly concentrated in west Cork today.", diaspora:"Donovan is common in the Irish-American community and in Britain, associated with Munster emigration.", hook:"The Donovans were pushed out of Limerick by the O'Briens and had to carve out a new kingdom in west Cork. They did — and they held it for four hundred years." },
  "wren":{ surname:"Wren", irish:"Ó Rinn", meaning:"Descendant of Rinn — point or headland", county:"Kerry, Cork, Waterford", province:"Munster", type:"Gaelic Irish", history:"Wren is an anglicisation of the Irish Ó Rinn, a Munster family. It may also in some cases be an anglicisation of Mac an Dreoilín meaning son of the wren — linking it to the ancient Irish tradition of the Wren Boys on St Stephen's Day, one of Ireland's oldest folk customs.", diaspora:"Wren is found in the Irish diaspora in Britain and the United States, concentrated among Munster emigration communities.", hook:"The Wren Boys — one of Ireland's oldest traditions, going from door to door on St Stephen's Day — may have carried your name with them for thousands of years." },
  "joyce":{ surname:"Joyce", irish:"Seoigh", meaning:"From the Norman de Joie — joy or lord", county:"Galway, Mayo", province:"Connacht", type:"Norman-Gaelic", history:"The Joyces were one of the fourteen Tribes of Galway and so thoroughly Gaelicised that they gave their name to Joyce Country — the spectacular mountain and lake district of north Galway. James Joyce, Ireland's most celebrated novelist, bore this ancient Galway name.", diaspora:"Joyce is common in the Irish diaspora particularly in the United States and Britain, made world famous by the novelist James Joyce.", hook:"The Joyces were so powerful in Galway that they gave their name to the mountains. And the man who wrote the most celebrated novel in the English language carried their name." },
  "grogan":{ surname:"Grogan", irish:"Ó Gruagáin", meaning:"Descendant of Gruagán — little hair", county:"Roscommon, Dublin, Wexford", province:"Connacht & Leinster", type:"Gaelic Irish", history:"The O'Grogans were a Connacht clan from Roscommon who spread throughout Leinster over centuries. The name referred to a distinctive physical characteristic of an early ancestor.", diaspora:"Grogan is found in the Irish diaspora in Britain and the United States.", hook:"Grogan means little hair — your entire clan is named after the hair of one man who lived over a thousand years ago. That one physical detail has been carried by every generation since." },
  "ohara":{ surname:"O'Hara", irish:"Ó hEaghra", meaning:"Descendant of Eaghra — possibly bitter or sharp", county:"Sligo, Antrim", province:"Connacht & Ulster", type:"Gaelic Irish", history:"The O'Haras were the ruling clan of Leyny in County Sligo. The name became famous worldwide through the fictional Scarlett O'Hara in Gone with the Wind — her creator Margaret Mitchell gave her heroine an Irish surname deliberately to reflect the fierce, proud spirit of the Irish.", diaspora:"O'Hara is common in the Irish-American community, made globally famous by Gone with the Wind.", hook:"Scarlett O'Hara — the most famous fictional Irish-American character ever written — was given your surname deliberately. Her creator wanted a name that meant fierce, proud, and unbreakable." },
  "mccoy":{ surname:"McCoy", irish:"Mac Aodha", meaning:"Son of Aodh — son of fire", county:"Antrim, Down, Derry", province:"Ulster", type:"Gaelic Irish / Scottish", history:"McCoy comes from Mac Aodha meaning son of the fire god Aodh. The phrase 'the real McCoy' — meaning the genuine article — has been associated with the name for over a century, though its exact origin is debated.", diaspora:"McCoy is common in the Irish-American community, and the phrase the real McCoy has made it one of the most recognised Irish-origin surnames in the English language.", hook:"The real McCoy — one of the most famous phrases in the English language — may carry your surname. The genuine article. The authentic thing. That was the McCoy reputation." },
  "shannon":{ surname:"Shannon", irish:"Ó Seanáin", meaning:"Descendant of Seanán — old or wise", county:"Limerick, Clare, Roscommon", province:"Munster & Connacht", type:"Gaelic Irish", history:"Shannon is both a surname and the name of Ireland's greatest river — the longest in the British Isles. The river takes its name from the goddess Sinann from Irish mythology. To carry the name Shannon is to carry the name of the river that defined the heart of Ireland.", diaspora:"Shannon is common in the Irish diaspora in the United States and Australia, and is the name of a major international airport serving the west of Ireland.", hook:"Shannon is both a surname and the name of the longest river in Ireland. The river itself is named after an Irish goddess. Your name is older than any church, any castle, any town in the country." },
  "coffey":{ surname:"Coffey", irish:"Ó Cobhthaigh", meaning:"Descendant of Cobhthach — victorious", county:"Cork, Kerry, Roscommon", province:"Munster & Connacht", type:"Gaelic Irish", history:"Aeneas Coffey, born in Ireland around 1780, invented the Coffey still in 1831 — the continuous distillation device that revolutionised the production of whiskey and spirits worldwide. Every whiskey produced by continuous distillation owes its existence to a man with your surname.", diaspora:"Coffey is found throughout the Irish diaspora in the United States, Britain, and Australia.", hook:"Coffey means victorious — and the man who bore it most memorably invented the device that makes almost every whiskey and spirit on earth. The Coffey still changed how the world drinks." },
  "mcguire":{ surname:"McGuire", irish:"Mac Uidhir", meaning:"Son of Odhar — pale or dun-coloured", county:"Fermanagh", province:"Ulster", type:"Gaelic Irish", history:"McGuire and Maguire are variants of the same name — Mac Uidhir. The Maguires were the Kings of Fermanagh for over 300 years, ruling from lake island fortresses across the beautiful Fermanagh lakeland.", diaspora:"McGuire is common in the Irish-American community, associated with Ulster emigration.", hook:"McGuire and Maguire are the same name — kings of Fermanagh who ruled from castles on islands in the middle of lakes for three hundred years." },
  "collins":{ surname:"Collins", irish:"Ó Coileáin", meaning:"Descendant of Coileán — young dog or whelp", county:"Cork, Limerick, Clare", province:"Munster", type:"Gaelic Irish", history:"Michael Collins — the revolutionary leader and architect of Irish independence — was born in County Cork in 1890. He negotiated the Anglo-Irish Treaty of 1921 and was assassinated in an ambush during the Civil War at age 31, in his own county, by his own countrymen.", diaspora:"Collins is one of the most common Irish surnames in the diaspora, with strong communities in the United States, Britain, and Australia.", hook:"Michael Collins negotiated Irish independence, built an intelligence network that defeated the British Empire, and was shot dead in an ambush at 31 — in his own county, by his own countrymen. Your name. Your story." },
  "mahoney":{ surname:"Mahoney", irish:"Ó Mathghamhna", meaning:"Descendant of Mathghamhan — bear", county:"Cork, Kerry", province:"Munster", type:"Gaelic Irish", history:"The O'Mahoneys were lords of Ivagha in the Mizen Peninsula of west Cork — the most westerly point of Ireland, where the land looks out toward America. They were closely related to the McCarthy kings and were one of the principal families of the Carbery region.", diaspora:"Mahoney is associated with the Munster diaspora, with strong communities in the United States particularly in Massachusetts.", hook:"The Mahoneys were lords of the most westerly point of Ireland — the Mizen Peninsula in west Cork, where the island looks out toward America. Your ancestors watched the Atlantic from their castle walls." },
  "kavanaugh":{ surname:"Kavanagh", irish:"Caomhánach", meaning:"Follower of Saint Caomhán", county:"Wexford, Carlow, Kilkenny", province:"Leinster", type:"Gaelic Irish", history:"The Kavanaghs were the Kings of Leinster, direct descendants of Diarmait MacMurrough — the king who invited the Normans to Ireland in 1169. Despite this complicated legacy, the Kavanaghs remained kings of their territory for centuries after the invasion.", diaspora:"Kavanagh is associated with Leinster emigration in the United States and Britain.", hook:"The Kavanaghs are descended from the man who invited the Normans to Ireland — the act that changed Irish history forever. They spent the next five centuries trying to live that down." },
  "callahan":{ surname:"Callahan", irish:"Ó Ceallacháin", meaning:"Descendant of Ceallachán — bright-headed warrior", county:"Cork, Kerry, Clare", province:"Munster", type:"Gaelic Irish", history:"The O'Callaghans descend from the 10th century King of Munster Ceallachán of Cashel who famously defeated the Vikings of Limerick. Their heartland was in County Cork where they were lords of Pobble O'Callaghan.", diaspora:"Callahan is one of the most common Irish-American surname spellings, particularly in Massachusetts and New York.", hook:"Callahan descends from a Munster king who defeated the Vikings of Limerick in the 10th century. Before Brian Boru, there was Ceallachán — and your name carries his." },
  "sullivan":{ surname:"Sullivan", irish:"Ó Súilleabháin", meaning:"Descendant of Súilleabhán — dark-eyed one", county:"Cork, Kerry", province:"Munster", type:"Gaelic Irish", history:"Sullivan is the same name as O'Sullivan — many families dropped the O prefix under English rule. After the Battle of Kinsale in 1601, Donal Cam O'Sullivan Beare led one of the most heroic and tragic marches in Irish history — 500 kilometres through winter with 1,000 followers, only 35 surviving.", diaspora:"Sullivan is one of the most common Irish surnames in America, found in every state but concentrated in the northeast.", hook:"Sullivan and O'Sullivan are the same ancient name. Your ancestors dropped the O under English pressure — but the Kerry clan who bore it first walked 500 kilometres through winter rather than surrender." },
  "daly":{ surname:"Daly", irish:"Ó Dálaigh", meaning:"Descendant of Dálach — frequenting assemblies", county:"Clare, Cork, Galway", province:"Munster & Connacht", type:"Gaelic Irish", history:"The O'Dalys were one of Ireland's most distinguished hereditary poet families, famous throughout Gaelic Ireland for their bardic tradition. They were the court poets of several great clans and produced some of the finest verse in the medieval Irish language. To be an Ó Dálaigh was not just a family name — it was a profession.", diaspora:"Daly is common throughout the Irish diaspora in the United States, Britain, and Australia.", hook:"Daly was not just a surname — it was a profession. Your ancestors were the official poets of Gaelic Ireland, the men who decided which kings would be remembered and how." },
  "howard":{ surname:"Howard", irish:"Ó hIomhair", meaning:"Descendant of Iomhar — from the Norse Ívarr, bow warrior", county:"Clare, Galway", province:"Munster & Connacht", type:"Gaelic Irish / Norse-Gaelic", history:"In Ireland, Howard is often an anglicisation of Ó hIomhair — a name with Viking roots embedded in Gaelic culture. The name Iomhar comes from the Old Norse Ívarr — a Viking name so common in Gaelic Ireland that the Irish made it their own.", diaspora:"Howard is common in the Irish diaspora, particularly in the United States.", hook:"Howard sounds completely English. But in Clare and Galway it is a Gaelic name with Viking roots — your ancestors were so shaped by the Norse invaders that they took a Viking name as their own." },
  "hanrahan":{ surname:"Hanrahan", irish:"Ó hAnracháin", meaning:"Descendant of Anrachán — warrior or champion", county:"Clare, Tipperary, Limerick", province:"Munster", type:"Gaelic Irish", history:"The O'Hanrahans were a Munster clan concentrated in Clare and Tipperary. W.B. Yeats created a wandering Irish poet named Red Hanrahan — one of his most celebrated characters — giving him your surname to represent the spirit of old Gaelic Ireland.", diaspora:"Hanrahan is found in the Irish diaspora in the United States and Australia, particularly from Munster emigration.", hook:"W.B. Yeats created a wandering Irish poet and gave him your surname — Red Hanrahan, the spirit of old Gaelic Ireland. When Yeats wanted to name the soul of Ireland, he chose your name." },
  "fennessy":{ surname:"Fennessy", irish:"Ó Fionnghusa", meaning:"Descendant of Fionnghus — fair strength", county:"Waterford, Tipperary, Kilkenny", province:"Munster & Leinster", type:"Gaelic Irish", history:"The O'Fennessys were a Munster clan concentrated in Waterford and south Tipperary. The name is very specifically regional and remains concentrated in the southeast of Ireland where it originated.", diaspora:"Fennessy is rare in the diaspora but found in Irish communities in Britain and the United States from Munster emigration.", hook:"Fennessy is so rooted in Waterford and Tipperary that you can still trace most people with this name to within fifty miles of where it began over a thousand years ago." },
  "donahue":{ surname:"Donahue", irish:"Ó Donnchadha", meaning:"Descendant of Donnchadh — brown warrior", county:"Kerry, Galway, Cork", province:"Munster & Connacht", type:"Gaelic Irish", history:"Donahue is an anglicisation of Ó Donnchadha. The Kerry O'Donoghues were lords of the Lakes of Killarney, with their stronghold on Ross Castle on the shores of Lough Leane. Their chief is said to ride across the lake every seven years on a white horse.", diaspora:"Donahue is common in the Irish-American community, particularly from Kerry and Galway emigration.", hook:"The Donahues were lords of the Lakes of Killarney. Their last chief is said to haunt Ross Castle to this day — riding across the water every seven years on a white horse." },
  "courtney":{ surname:"Courtney", irish:"Mac Curnáin / de Courtenay", meaning:"From the Norman de Courtenay — from Courtenay in France", county:"Kerry, Cork, Limerick", province:"Munster", type:"Norman / Gaelic Irish", history:"Courtney in Ireland has Norman origins — the de Courtenay family came with the 1169 invasion. The de Courtenay family in France were so noble that one of their number became Emperor of Constantinople in 1216.", diaspora:"Courtney is found in the Irish diaspora in the United States and Britain.", hook:"Courtney came to Ireland with the Norman invasion in 1169 — but the family they descended from in Normandy were so noble that one of them became Emperor of Constantinople." },
  "kearns":{ surname:"Kearns", irish:"Ó Céirín", meaning:"Descendant of Céirín — little dark one", county:"Mayo, Roscommon, Meath", province:"Connacht & Leinster", type:"Gaelic Irish", history:"Father Mogue Kearns was a rebel priest who bore your surname. He fought in the 1798 United Irish uprising and was hanged by the British for his part in the rebellion.", diaspora:"Kearns is found in the Irish diaspora in the United States and Britain.", hook:"Father Mogue Kearns bore your surname. A Catholic priest who picked up a pike in 1798, fought for Irish freedom, and was hanged by the British. A rebel until the last." },
  "costello":{ surname:"Costello", irish:"Mac Oisdealbhaigh", meaning:"Son of Oisdealbhach — fawn-like", county:"Mayo, Galway", province:"Connacht", type:"Norman-Gaelic", history:"The Costellos are unique — a Norman family who became so thoroughly Gaelicised that they adopted the Mac prefix rather than the Norman Fitz. They gave their name to the barony of Costello in County Mayo, one of the few places in Ireland named after a Norman family using the Irish Mac naming convention.", diaspora:"Costello is found in the Irish diaspora in the United States and Britain, particularly from Connacht emigration.", hook:"Costello is the only Norman family in Ireland who liked the Irish naming system so much they ditched their own. They took a Mac name — like a Gaelic clan. The Normans who went completely native." },
  "kearney":{ surname:"Kearney", irish:"Ó Catharnaigh", meaning:"Descendant of Catharnach — warlike or soldier-like", county:"Tipperary, Mayo, Down", province:"Munster & Connacht", type:"Gaelic Irish", history:"Pearce Kearney composed The Wearing of the Green in 1798 — the rebel song that became an anthem for the United Irish uprising and was banned by the British for its seditious content.", diaspora:"Kearney is common in the Irish diaspora in the United States and Australia, particularly from Munster and Connacht emigration.", hook:"The Wearing of the Green — the song that got so many Irish people arrested in 1798 that the British banned it — was written by a Kearney. Your surname wrote the anthem of rebellion." },
  "odowd":{ surname:"O'Dowd", irish:"Ó Dubhda", meaning:"Descendant of Dubhda — black or dark", county:"Sligo, Mayo", province:"Connacht", type:"Gaelic Irish", history:"The O'Dowds were the ruling clan of Tireragh in County Sligo, lords of a coastal territory stretching along the Atlantic shore. Their territory included some of the most dramatically beautiful coastline in the west of Ireland.", diaspora:"O'Dowd is associated with the Connacht diaspora in the United States and Britain.", hook:"The O'Dowds ruled the Atlantic coast of Sligo — the wildest, most dramatic coastline in Ireland. They watched the ocean from their fort for five centuries." },
  "mccauley":{ surname:"McCauley", irish:"Mac Amhlaoibh", meaning:"Son of Amhlaoibh — from the Norse Ólafr", county:"Fermanagh, Antrim, Derry", province:"Ulster", type:"Gaelic Irish / Norse-Gaelic", history:"McCauley comes from Mac Amhlaoibh, meaning son of Ólaf — a Norse name that became deeply embedded in the Gaelic Irish tradition. The name reflects the centuries of Viking settlement along the Irish coast.", diaspora:"McCauley is common in the Ulster diaspora in Scotland, the United States, and Canada.", hook:"McCauley is a Gaelic Irish name with a Viking heart. It means son of Ólaf — a Norse name so common in Gaelic Ireland that the Irish made it their own." },
  "buckley":{ surname:"Buckley", irish:"Ó Buachalla", meaning:"Descendant of Buachaill — boy or cowherd", county:"Cork, Kerry, Tipperary", province:"Munster", type:"Gaelic Irish", history:"The O'Buckleys were a Munster clan concentrated in Cork and Kerry. Despite the humble meaning — cowherd — the Buckleys became one of Cork's most enduring families. The name is among the most common in Cork city and county.", diaspora:"Buckley is common in the Irish-American community, particularly in Massachusetts and New York from Munster emigration.", hook:"Buckley means cowherd — one of the most grounded, earthly names in all of Ireland. And the family that bore it grew from Cork farmers into one of the county's most enduring names." },
  "mcnamara":{ surname:"McNamara", irish:"Mac Conmara", meaning:"Son of Conmara — hound of the sea", county:"Clare", province:"Munster", type:"Gaelic Irish", history:"The MacNamaras were the second most powerful clan in Clare after the O'Briens. They built several castles along the River Shannon and their territory is still dotted with McNamara tower houses. Knappogue Castle, one of Ireland's most visited heritage sites, was a McNamara stronghold.", diaspora:"McNamara is strongly associated with Clare and the Munster diaspora, with large communities in the United States particularly in Massachusetts.", hook:"McNamara means hound of the sea — and your clan built so many castles in Clare that you can still count them today. Knappogue Castle, one of Ireland's most famous, was yours." },
  "murray":{ surname:"Murray", irish:"Ó Muireadhaigh", meaning:"Descendant of Muireadhach — lord or master mariner", county:"Roscommon, Galway, Down", province:"Connacht & Ulster", type:"Gaelic Irish", history:"There were multiple Murray clans across Ireland. The Connacht Murrays were a significant Roscommon family while the Ulster Murrays were prominent in Down. Murray is among the most common surnames across both Ireland and Scotland.", diaspora:"Murray is extremely common in the Irish and Scottish diaspora worldwide, particularly in the United States, Canada, and Australia.", hook:"Murray means lord or master mariner — your ancestors were named after the sea and the skill to command it. And the name spread so far and so wide it became common on three continents." },
  "garvey":{ surname:"Garvey", irish:"Ó Gairbhith", meaning:"Descendant of Gairbhith — rough peace", county:"Mayo, Roscommon, Donegal", province:"Connacht & Ulster", type:"Gaelic Irish", history:"The O'Garveys were a Connacht clan concentrated in Mayo and Roscommon. Marcus Garvey, the Jamaican Pan-Africanist leader who inspired a global movement, bore a name of Irish origin — his ancestors were likely enslaved people who had been given the surname of an Irish plantation owner.", diaspora:"Garvey is found in the Irish diaspora in the United States and Britain, with Marcus Garvey the most famous historical bearer of the name.", hook:"Garvey means rough peace — a name of contradictions. And the most famous man to bear it, Marcus Garvey, built a movement that changed the world from a name that came from Ireland." },
  "redmond":{ surname:"Redmond", irish:"Réamonn", meaning:"From the Norman Raimund — wise protector", county:"Wexford, Waterford, Dublin", province:"Leinster", type:"Norman-Gaelic", history:"John Redmond was the leader of the Irish Parliamentary Party at Westminster from 1900 to 1918 — the man who came closest to achieving Irish Home Rule through constitutional means, without a single shot fired. Then 1916 happened and history moved on without him.", diaspora:"Redmond is associated with the Leinster diaspora in the United States and Britain.", hook:"John Redmond was the man who almost got Ireland its freedom through parliament — without a single shot fired. Then 1916 happened. And history moved on without him." },
  "dolan":{ surname:"Dolan", irish:"Ó Dubhláin", meaning:"Descendant of Dubhlán — black defiance", county:"Roscommon, Galway, Leitrim", province:"Connacht", type:"Gaelic Irish", history:"The O'Dolans were a Connacht clan from Roscommon and Galway. The name means black defiance — suggesting a fierce ancestor who stood against authority.", diaspora:"Dolan is found in the Irish diaspora in the United States and Britain, associated with Connacht emigration.", hook:"Dolan means black defiance. Your ancestors were literally named for their refusal to be beaten. That stubbornness is built into the name itself." },
  "gleason":{ surname:"Gleason", irish:"Ó Glasáin", meaning:"Descendant of Glasán — little green or grey-green one", county:"Tipperary, Clare, Cork", province:"Munster", type:"Gaelic Irish", history:"The O'Gleasons were a Munster clan in Tipperary and Clare, part of the Dal Cais tribal grouping that produced Brian Boru. The comedian Jackie Gleason — one of America's most beloved entertainers — bore this Tipperary name.", diaspora:"Gleason is common in the Irish-American community, particularly from Munster emigration. Jackie Gleason, The Great One, carried this name.", hook:"Jackie Gleason — one of the greatest comedians in American history — carried a Tipperary name. The same county that produced Brian Boru, High King of Ireland, produced the Great One." },
  "lyons":{ surname:"Lyons", irish:"Ó Laighin / Ó Liathain", meaning:"Descendant of Laighean — the spear, or Liathán — grey one", county:"Galway, Roscommon, Cork", province:"Connacht & Munster", type:"Gaelic Irish", history:"Lyons has multiple Irish origins — from Ó Laighin in Connacht and Ó Liathain in Munster — two completely different clans who ended up with the same anglicised name.", diaspora:"Lyons is common throughout the Irish diaspora in the United States, Britain, and Australia.", hook:"Lyons has two completely different Irish origins depending on your county. The same name — two different clans, two different stories, two different bloodlines that history accidentally merged." },
  "cahill":{ surname:"Cahill", irish:"Ó Cathail", meaning:"Descendant of Cathal — battle mighty", county:"Tipperary, Kerry, Galway", province:"Munster & Connacht", type:"Gaelic Irish", history:"The O'Cahills were a Munster clan in Tipperary, part of the powerful web of families in that county. The name Cathal — battle mighty — was one of the most common Gaelic personal names, borne by kings and warriors across every province of Ireland.", diaspora:"Cahill is common in the Irish diaspora in the United States and Australia, particularly from Munster emigration.", hook:"Cahill means battle mighty — and the personal name it comes from was so common among Irish warriors and kings that it spread to every corner of the island." },
  "hanley":{ surname:"Hanley", irish:"Ó hAinle", meaning:"Descendant of Ainle — beauty or champion", county:"Roscommon, Galway, Leitrim", province:"Connacht", type:"Gaelic Irish", history:"The O'Hanleys were lords of Sodhan in County Roscommon. The name is connected to the hero Ainle of the Fianna — the great warrior band of Irish mythology.", diaspora:"Hanley is found in the Irish diaspora in the United States and Britain, associated with Connacht emigration.", hook:"Hanley is connected to the heroes of the Fianna — the legendary warrior band of Irish mythology. Your surname carries the name of a champion from the oldest stories Ireland ever told." },
  "mckeon":{ surname:"McKeon", irish:"Mac Eoghain", meaning:"Son of Eoghan — born of the yew tree", county:"Roscommon, Leitrim, Sligo", province:"Connacht", type:"Gaelic Irish", history:"The McKeons were a Connacht clan in Roscommon and Leitrim. The yew tree was sacred in ancient Irish culture — associated with immortality and the otherworld. To name your son after the yew was an act of devotion.", diaspora:"McKeon is found in the Irish diaspora in the United States and Britain, associated with Connacht emigration.", hook:"McKeon means son of the yew tree — because the yew was so sacred in ancient Ireland that naming your son after it was an act of devotion. Your family was named for a tree that can live for five thousand years." },
  "monahan":{ surname:"Monahan", irish:"Ó Manacháin", meaning:"Descendant of Manachán — little monk", county:"Roscommon, Monaghan, Fermanagh", province:"Connacht & Ulster", type:"Gaelic Irish", history:"The O'Monaghans were a clan whose name literally means little monk. The county of Monaghan takes its name from a related word. The clan had presence in both Connacht and Ulster.", diaspora:"Monahan is found in the Irish diaspora in the United States and Britain.", hook:"Monahan means little monk. Your entire clan is named after one ancestor's devotion — a man so defined by his faith that every generation after him carried it in their name." },
  "sheridan":{ surname:"Sheridan", irish:"Ó Sirideáin", meaning:"Descendant of Sirideán — seeker", county:"Cavan, Longford, Leitrim", province:"Ulster & Leinster", type:"Gaelic Irish", history:"Richard Brinsley Sheridan, the most celebrated playwright of 18th century London — writer of The Rivals and The School for Scandal — was of Irish descent and bore this Cavan name. His plays are still performed worldwide.", diaspora:"Sheridan is common in the Irish diaspora in Britain and the United States, made famous by the playwright Richard Brinsley Sheridan.", hook:"The greatest comic playwright of 18th century London bore your surname. Richard Brinsley Sheridan came from a Cavan family — and his plays are still making audiences laugh 250 years later." },
  "cashin":{ surname:"Cashin", irish:"Ó Caisin", meaning:"Descendant of Caisín — little curly-haired one", county:"Offaly, Tipperary, Kilkenny", province:"Leinster & Munster", type:"Gaelic Irish", history:"The O'Cashins were a midlands clan concentrated in Offaly and the Leinster-Munster borderland. The name refers to a curly-haired ancestor — a small detail that became a family identity carried across generations.", diaspora:"Cashin is found in the Irish diaspora in Britain, the United States, and Australia.", hook:"Cashin means the little curly-haired one. Someone's curly hair over a thousand years ago became a family name that has been carried by every generation since." },
  "coughlin":{ surname:"Coughlin", irish:"Ó Cochláin", meaning:"Descendant of Cochlán — hooded one", county:"Cork, Clare, Tipperary", province:"Munster", type:"Gaelic Irish", history:"The O'Coughlins were a Munster clan concentrated in Cork and Clare. The name likely refers to an ancestor who wore a distinctive hood or cloak. The family remains strongly associated with Munster.", diaspora:"Coughlin is common in the Irish-American community, particularly from Munster emigration in Massachusetts and New York.", hook:"Coughlin means the hooded one — your entire family line is named after one ancestor's cloak, a distinctive garment worn a thousand years ago that became the identity of every generation after." },
  "macdonald":{ surname:"MacDonald", irish:"Mac Domhnaill", meaning:"Son of Domhnall — world mighty", county:"Antrim, Down", province:"Ulster", type:"Gaelic Irish / Scottish", history:"In Ireland the MacDonalds of Antrim were the powerful Scottish-Irish clan who dominated the Glens of Antrim. In Scotland the Clan Donald was the most powerful of all Highland clans — Lords of the Isles for centuries. The Irish and Scottish MacDonalds shared ancestry and regularly crossed the twelve-mile sea between Antrim and Kintyre.", diaspora:"MacDonald is one of the most common surnames in the Scottish and Irish diaspora worldwide, found on every continent.", hook:"The narrow sea between Antrim and Scotland is only twelve miles wide. The MacDonalds crossed it so often that it barely mattered which side of the water they were on." },
  "obannon":{ surname:"O'Bannon", irish:"Ó Banáin", meaning:"Descendant of Banán — white or fair", county:"Fermanagh, Leitrim", province:"Ulster & Connacht", type:"Gaelic Irish", history:"The O'Bannons were an Ulster clan from Fermanagh, associated with the Maguire kings of that county. They were part of the network of families that served and supported the great Ulster dynasties.", diaspora:"O'Bannon is found in the Irish-American community, particularly from Ulster emigration.", hook:"O'Bannon means descendant of the fair one — and your clan served as part of the great Maguire kingdom of Fermanagh, the lords who ruled from island castles on the lakes." },
  "creedon":{ surname:"Creedon", irish:"Ó Crídín", meaning:"Descendant of Crídín — little heart", county:"Cork", province:"Munster", type:"Gaelic Irish", history:"The O'Creedons are a Cork clan, deeply rooted in the Muskerry area of County Cork. The name is one of the more distinctive Cork surnames and remains strongly concentrated in the county of its origin.", diaspora:"Creedon is found in the Irish diaspora in Britain and the United States, almost exclusively from Cork emigration.", hook:"Creedon means little heart — and the clan that bore it is so rooted in Cork that almost every Creedon in the world can trace their family to the same few parishes in Muskerry." },
  "balfe":{ surname:"Balfe", irish:"Balbh", meaning:"From balbh — mute or stammerer", county:"Meath, Louth, Dublin", province:"Leinster", type:"Norman-Gaelic", history:"Michael William Balfe, born in Dublin in 1808, was one of the most celebrated opera composers of the 19th century. His aria I Dreamt I Dwelt in Marble Halls — from his opera The Bohemian Girl — is one of the most famous melodies ever composed by an Irish musician.", diaspora:"Balfe is rare but found in the Irish diaspora in Britain and the United States.", hook:"The most famous Balfe in history wrote one of the most beautiful melodies ever composed — I Dreamt I Dwelt in Marble Halls. Michael Balfe was a Dublin man who conquered the opera houses of Europe." },
  "carr":{ surname:"Carr", irish:"Ó Carra", meaning:"Descendant of Carra — spear", county:"Mayo, Galway, Donegal", province:"Connacht & Ulster", type:"Gaelic Irish", history:"Carr has multiple Irish origins — from Ó Carra in Connacht meaning spear, and from different Ulster origins. The Connacht Carrs were a Mayo and Galway family.", diaspora:"Carr is common in the Irish diaspora in the United States, Britain, and Australia.", hook:"Carr means spear in Irish — a weapon, a symbol of a warrior. Your ancestors chose to name their line after the instrument of battle." },
  "mcmullin":{ surname:"McMullin", irish:"Mac Maoláin", meaning:"Son of Maolán — devotee or tonsured one", county:"Derry, Antrim, Tyrone", province:"Ulster", type:"Gaelic Irish", history:"The Mac Mullins were an Ulster clan from Derry and Antrim. The name suggests an ancestor who was a devotee of the church — possibly a lay monastic closely associated with ecclesiastical life in early medieval Ireland.", diaspora:"McMullin is found in the Irish diaspora in Scotland, the United States, and Canada from Ulster emigration.", hook:"McMullin means son of the devotee — your ancestors were so known for their faith that it became their identity, their name, their legacy across a thousand years." },
  "clohessy":{ surname:"Clohessy", irish:"Ó Clochair", meaning:"Descendant of Clochar — stony place", county:"Limerick, Clare, Tipperary", province:"Munster", type:"Gaelic Irish", history:"The O'Clohessys were a Munster clan concentrated in Limerick and Clare. The name is very specifically Munster in character and remains strongly concentrated in those counties today.", diaspora:"Clohessy is rare in the diaspora but found in Irish communities in Britain and the United States from Munster emigration.", hook:"Clohessy is so rooted in Limerick and Clare that it is almost impossible to find the name outside Munster. If you have this name, your people come from a very specific corner of Ireland." },
  "beamish":{ surname:"Beamish", irish:"de Beaumeis", meaning:"From the Norman de Beaumeis — beautiful mansion", county:"Cork", province:"Munster", type:"Norman", history:"The Beamish family came to Ireland as Normans and settled in Cork. Beamish and Crawford, the Cork brewery established in 1792, became one of Ireland's oldest and most celebrated breweries — producing Beamish stout that is a Cork institution.", diaspora:"Beamish is found in the Irish diaspora in Britain and the United States, almost exclusively from Cork origins.", hook:"Beamish and Crawford — one of Ireland's oldest breweries, founded in Cork in 1792. Your Norman ancestors came to Ireland with swords. Their descendants conquered Cork with stout." },
  "oherron":{ surname:"O'Herron", irish:"Ó hEaráin", meaning:"Descendant of Earán — possibly nobleman", county:"Tyrone, Derry", province:"Ulster", type:"Gaelic Irish", history:"The O'Herrons were an Ulster clan from Tyrone and Derry, part of the complex network of families in that province. The name is relatively rare and specifically Ulster in character.", diaspora:"O'Herron is found in the Irish diaspora in Scotland and the United States from Ulster emigration.", hook:"O'Herron is one of Ulster's rarer names — which means if you carry it, your roots go directly back to Tyrone and Derry, to one specific place, one specific clan, one specific story." },
